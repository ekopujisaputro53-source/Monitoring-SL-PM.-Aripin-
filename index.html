<!DOCTYPE html>
<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Sambungan Langsung (SL)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (XLSX) CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f051d; }
        ::-webkit-scrollbar-thumb { background: #2e1065; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4c1d95; }

        .bg-card-gradient {
            background: linear-gradient(145deg, rgba(34, 9, 71, 0.85) 0%, rgba(15, 5, 29, 0.95) 100%);
        }
        .bg-navbar-gradient {
            background: linear-gradient(90deg, #0f051d 0%, #1e1b4b 50%, #2e1065 100%);
        }
        .text-gradient-purple {
            background: linear-gradient(135deg, #c084fc 0%, #e879f9 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

                        <p class="text-xs text-purple-300/70">Sistem Pengawasan Sambungan Rumah Air Minum</p>

                </div>
